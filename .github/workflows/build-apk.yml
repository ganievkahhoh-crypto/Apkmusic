name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show repository structure
        run: |
          echo "=== Файлы репозитория ==="
          find . -path ./.git -prune -o -type f -print | head -60

      - name: Locate project
        id: locate
        run: |
          FOUND=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$FOUND" ]; then
            echo "ОШИБКА: settings.gradle не найден — файлы проекта не загружены"
            exit 1
          fi
          DIR=$(dirname "$FOUND")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Проект найден в: $DIR"

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: ${{ steps.locate.outputs.dir }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
